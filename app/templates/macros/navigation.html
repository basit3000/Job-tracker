{% macro nav_link(label, endpoint, icon, active=false) -%}
<a class="workspace-link{{ ' is-active' if active }}" href="{{ url_for(endpoint) }}"{% if active %} aria-current="{{ 'page' if request.endpoint == endpoint else 'true' }}"{% endif %}>
  <i class="bi bi-{{ icon }}" aria-hidden="true"></i><span>{{ label }}</span>
</a>
{%- endmacro %}

{% macro tool_link(label, description, endpoint, icon) -%}
<li><a class="dropdown-item header-menu-link{{ ' active' if request.blueprint == endpoint.split('.')[0] }}" href="{{ url_for(endpoint) }}"{% if request.endpoint == endpoint %} aria-current="page"{% endif %}>
  <i class="bi bi-{{ icon }}" aria-hidden="true"></i><span><strong>{{ label }}</strong><small>{{ description }}</small></span>
</a></li>
{%- endmacro %}
